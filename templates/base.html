<!doctype html>
<html lang="es-CL" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta
            name="description"
            content="{% block descripcion %}Descubre juegos de mesa para compartir en Tienda de Juegos de Mesa.{% endblock %}"
        >
        <title>{% block titulo %}Tienda de Juegos de Mesa{% endblock %}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        >
        <style>
            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .skip-link {
                position: absolute;
                top: -3rem;
                left: 1rem;
                z-index: 1100;
            }

            .skip-link:focus {
                top: 1rem;
            }
        </style>
        {% block extra_head %}{% endblock %}
    </head>
    <body>
        <a class="skip-link btn btn-light" href="#contenido-principal">
            Saltar al contenido
        </a>

        <header>
            <div class="border-bottom bg-body-secondary">
                <div class="container py-2 small text-body-secondary">
                    Juegos para compartir grandes partidas.
                </div>
            </div>
            <nav class="navbar navbar-expand-lg bg-body border-bottom">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                        Tienda de Juegos de Mesa
                    </a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navegacion-principal"
                        aria-controls="navegacion-principal"
                        aria-expanded="false"
                        aria-label="Abrir navegación"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navegacion-principal">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'home' %}#catalogo">
                                    Catálogo
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main id="contenido-principal" class="container flex-grow-1 py-4 py-lg-5">
            {% block contenido %}{% endblock %}
        </main>

        <footer class="border-top bg-body-secondary">
            <div class="container py-4 small text-body-secondary">
                Tienda de Juegos de Mesa · Que comience la partida.
            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
